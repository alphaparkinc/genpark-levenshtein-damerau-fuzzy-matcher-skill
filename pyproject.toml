[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-levenshtein-damerau-fuzzy-matcher-skill"
version = "1.0.0"
description = "Damerau-Levenshtein edit distance metric with transposition detection and fuzzy string candidate ranker."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-levenshtein-damerau-fuzzy-matcher-skill"
Repository = "https://github.com/alphaparkinc/genpark-levenshtein-damerau-fuzzy-matcher-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-levenshtein-damerau-fuzzy-matcher-skill/issues"
